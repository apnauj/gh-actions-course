name: clase-triggers
run-name: Clase sobre Triggers
on:
    workflow_dispatch:
        inputs:
            edad:
                description: 'Edad'
                required: true
                type: number
            nombre:
                description: 'Nombre'
                required: true
                default: 'Juan'
                type: string
    push:
        branches:
            - 'main'
            - 'aprendiendo-github-actions'
    schedule:
        - cron: '15 11 * * *'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: run main.py
              run: python triggers.py
    mayor:
        if: ${{ inputs.edad >= 18 }} 
        runs-on: ubuntu-latest
        steps:
        - name: Correr script
          run: echo ${{ inputs.nombre }} es mayor de edad
    menor:
        if: ${{ inputs.edad < 18 }} 
        runs-on: ubuntu-latest
        steps:
        - name: Correr script
          run: echo ${{ inputs.nombre }} es menor de edad
