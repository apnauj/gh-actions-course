name: clase-triggers
run-name: Clase sobre Triggers
on:
    workflow_dispatch:
    push:
        branches:
            - 'main'
            - 'aprendiendo-github-actions'
    schedule:
        - cron: '15 11 * * *'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: run main.py
              run: python main.py